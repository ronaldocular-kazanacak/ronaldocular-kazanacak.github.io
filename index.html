<!doctype html>
<html lang="tr">
    <head>
        <style>
          :root {
    --bg: #090909;
    --surface: #1e293b;
    --surface-hover: #273449;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #3b82f6;
    --border: #334155;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(0,0,0,.25);
    --max-width: 960px;
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;

    background: var(--bg);
    color: var(--text);
    line-height: 1.7;

    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

main {
    width: min(92%, var(--max-width));
    padding: 4rem 0;
}

section {
    text-align: center;
}

.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);

    padding: 2rem;
    margin-bottom: 1.5rem;

    box-shadow: var(--shadow);
    transition: .25s;
}

.card:hover {
    transform: translateY(-4px);
    background: var(--surface-hover);
}

h1 {
    margin: 0;
    font-size: clamp(2.5rem, 6vw, 4rem);
}

h2 {
    margin-top: 0;
    font-size: 1.7rem;
}

h3 {
    margin-bottom: .5rem;
}

p {
    color: var(--muted);
    max-width: 650px;
    margin: 1rem auto;
}

#type {
    color: var(--primary);
    font-size: clamp(2rem, 6vw, 3rem);
    min-height: 60px;
    font-weight: 700;
}

ul {
    list-style: none;
    padding: 0;
    margin: 1.5rem 0;

    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: .8rem;
}

li {
    background: rgba(59,130,246,.12);
    border: 1px solid rgba(59,130,246,.3);

    color: #dbeafe;

    padding: .55rem 1rem;
    border-radius: 999px;
}

a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 700;
}

a:hover {
    text-decoration: underline;
}

.email {
    display: inline-block;
}

footer {
    width: 100%;
    text-align: center;

    color: var(--muted);

    padding: 2rem 1rem;
    border-top: 1px solid var(--border);

    font-size: .95rem;
}

::selection {
    background: var(--primary);
    color: white;
}

::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: var(--bg);
}

::-webkit-scrollbar-thumb {
    background: var(--surface-hover);
    border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--primary);
}

@media (max-width: 768px) {
    main {
        width: 94%;
        padding: 2rem 0;
    }

    .card {
        padding: 1.5rem;
    }

    #type {
        font-size: 2rem;
    }
  }
        </style>

        <script>
            const texts = [
    "RONALDCULAR KAZANACAK",
    "KURUŞ BİTECEK",
    "KURUŞ DEVRİ ARTIK BİTTİ"
];

const type = document.getElementById("type");

let textIndex = 0;
let charIndex = 0;
let deleting = false;

const writeSpeed = 80;
const deleteSpeed = 45;
const waitTime = 1500;

function typeWriter() {
    const current = texts[textIndex];

    if (!deleting) {
        type.textContent = current.slice(0, ++charIndex);

        if (charIndex === current.length) {
            deleting = true;
            return setTimeout(typeWriter, waitTime);
        }

        return setTimeout(typeWriter, writeSpeed);
    }

    type.textContent = current.slice(0, --charIndex);

    if (charIndex === 0) {
        deleting = false;
        textIndex = (textIndex + 1) % texts.length;
    }

    setTimeout(typeWriter, deleteSpeed);
}

typeWriter();
